<!DOCTYPE html>
<html>
<head>
    <title>Job Finder Results</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 16px; }
        h1 { color: #333; }
        h2 { color: #667eea; }
        ul { margin-bottom: 30px; }
    </style>
</head>
<body>
    <h1>Job Results for: {{ skills }}</h1>
    {% for skill, jobs in results.items() %}
        <h2>Jobs for {{ skill }}:</h2>
        <ul>
        {% for job in jobs %}
            <li>{{ job|safe }}</li>
        {% endfor %}
        </ul>
    {% endfor %}
    <a href="/">Back to resume generator</a>
</body>
</html>
